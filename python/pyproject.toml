[project]
name = "web2md-client"
version = "0.1.0"
description = "Python client for the Web2MD API: web pages to clean Markdown and heading-aware RAG chunks, with LangChain and LlamaIndex loaders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kanav Singla" }]
keywords = ["markdown", "rag", "langchain", "llamaindex", "web-scraping", "chunking", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]

[project.urls]
Homepage = "https://rapidapi.com/kanavsingla28/api/web2md-webpage-to-markdown-rag-chunks"
Source = "https://github.com/kanavsingla28/web2md-clients"
Issues = "https://github.com/kanavsingla28/web2md-clients/issues"
Documentation = "https://github.com/kanavsingla28/web2md-clients/tree/main/python#readme"

[dependency-groups]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8",
  "langchain-core>=0.3", "llama-index-core>=0.12",
]
examples = ["langchain-community>=0.3", "fastembed>=0.4", "llama-index-embeddings-fastembed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web2md_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: calls the real API; needs RAPIDAPI_KEY"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples", "README.md"]  # example is pinned byte-for-byte to the README block

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
